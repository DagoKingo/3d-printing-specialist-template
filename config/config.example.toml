# Configuración de 3D Printing Specialist Template

[printer]
model = "Elegoo Centauri Carbon 2"
multimaterial_system = "Elegoo Canvas" # Sistema multi-material (4 slots)
canvas_slots = 4
has_multimaterial = true
build_volume_x = 256.0 # mm
build_volume_y = 256.0 # mm
build_volume_z = 256.0 # mm
nozzle_diameter = 0.4  # mm (acero endurecido / hardened steel)
enclosed_chamber = true
max_nozzle_temp = 300  # °C
max_bed_temp = 110     # °C

# Parámetros de conexión de red (SDCP WebSocket para CC1 / MQTT para CC2)
# Modifica con la IP asignada a tu Centauri en tu red WiFi/Ethernet
ip = "192.168.1.100"
sdcp_port = 3030
mqtt_port = 1883
access_code = ""       # Código de Acceso / LAN PIN de la pantalla (requerido para CC2)
mainboard_id = ""      # ID de placa base (auto-detectado)

[slicer]
preferred = "OrcaSlicer" # Opciones: "OrcaSlicer", "Elegoo Slicer", "PrusaSlicer", "BambuStudio"
binary_path = "orca-slicer" # Comando o ruta al ejecutable

[design]
default_cad = "openscad" # Opciones: "openscad", "cadquery", "build123d"
default_preview_fn = 32
default_export_fn = 128

[paths]
pieces_dir = "pieces"        # Directorio canónico para piezas con sus artefactos y prototipos

